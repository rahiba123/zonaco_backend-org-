version: '3.8'

services:
  # Zanaco FAQ Chatbot FastAPI Backend
  chatbot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zanaco_chatbot_api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - .env
    volumes:
      - ./data/chroma_db:/app/data/chroma_db
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - zanaco-net

  # Optional Redis service for multi-instance session clustering
  redis:
    image: redis:7-alpine
    container_name: zanaco_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - zanaco-net

networks:
  zanaco-net:
    driver: bridge

volumes:
  redis-data:
